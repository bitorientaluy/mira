name: mira

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mira_app
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mira
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: mira_nginx
    ports:
      # 8080 es el puerto que el proxy de la DMZ espera en SRV-POSIX
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mira
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: mira_db
    # Sin "ports": MySQL solo es accesible desde la red interna de Compose
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mira
    restart: unless-stopped

networks:
  mira:
    driver: bridge

volumes:
  dbdata:
